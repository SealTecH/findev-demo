# Checks only; Vercel deploys on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm/producer
    steps:
      - uses: actions/checkout@v5

      # Toolchain, wasm32 target, clippy and rustfmt come from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/producer

      - name: Format
        run: cargo fmt --check

      - name: Clippy (native)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same install script as on Vercel.
      - name: Install (same as Vercel)
        run: bash scripts/vercel-install.sh

      # After install: the cache key depends on rustc.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/producer

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
